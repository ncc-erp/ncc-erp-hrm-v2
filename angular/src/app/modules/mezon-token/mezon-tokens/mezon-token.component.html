<div class="px-4">
    <div class="breadcrumb header">
        <app-bread-crumb [listBreadCrumb]="listBreadCrumb"></app-bread-crumb>
    </div>
    <div class="card">
        <div class="card-header">


            <div class="row">
                <div class="col-4 ">
                    <app-search [placeholder]="'Search by Email or Note'" [seachText]="searchText"
                        (onSearch)="onSearchEnter($event)"></app-search>
                </div>
                <div class="col-2 ">
                   
                    <table-filter [filterType]="filterTypeEnum.Dropdown" [dropdownData]="statusSendTokens" 
                    [placeholder]="'Status'" [defaultValue]="DEFAULT_FILTER.status"
                    (onTableFilter)="onTableFilter(filterTypeEnum.Dropdown, $event, 'statusToken')">
                    </table-filter>
                </div>
                  <div class="col-2 ">
                     <chart-select class="w-100" style="margin-top: 8px; margin-bottom:18px;"
                             (onSelect)="onPayrollSelect($event)"
                             [label]="'Payroll'"
                             [defaultValue]="selectedPayroll"
                             [placeholder]="'Payroll'"
                             [dropdownData]="listPayroll">
            </chart-select>
                  </div>
                <div class="d-flex justify-content-end gap-2 col-4" >
                    <button class="btn btn-primary mr-2" (click)="onExport()" *ngIf="isShowExportBtn()">
                        Export
                    </button>
                    <button class="btn btn-primary  mr-2 " (click)="openAddMezonToken()" *ngIf="isShowAddBtn()">
                        Add
                    </button>
                    <button class="btn btn-success" (click)="SentAllMezonToken()" *ngIf="isShowSentTokenAllBtn()">
                        Send All Pending
                    </button>
                    <button *ngIf="isShowDeleteAllBtn()" class="btn btn-danger" (click)="deleteAllPending()" style="margin-left: 10px;">
                        Delete All Pending
                    </button>
                </div>
                
                
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <div class="fixTableHead">
                    <table class="table table-striped table-hover">
                        <thead>
                            <th class="col-stt">#</th>
                            <th class="pointer sticky-col" (click)="onSortChange('email')" style="min-width: 350px;">Employee
                                <sortable [name]="'email'" [sortProperty]="sortProperty"
                                        [sortDirection]="sortDirection"></sortable>
                            </th>
                            <th  (click)="onSortChange('payrollApplyMonth')"  style="min-width: 100px;">Payroll
                                <sortable [name]="'payrollApplyMonth'" [sortProperty]="sortProperty"
                                        [sortDirection]="sortDirection"></sortable>
                            </th>
                            <th (click)="onSortChange('amount')" >MezonToken<br>{{ totalAmount | moneyFormat }}
                                <sortable [name]="'amount'" [sortProperty]="sortProperty"
                                        [sortDirection]="sortDirection"></sortable>
                            </th>  
                            <th class="pointer sticky-col"  style="min-width: 350px;">Note</th>
                            <th >Status</th>
                            <th (click)="onSortChange('sentToEmployeeAt')" >Sent At
                                <sortable [name]="'sentToEmployeeAt'" [sortProperty]="sortProperty"
                                        [sortDirection]="sortDirection"></sortable>
                            </th>                
                            <th class="col-action" style="width: 100px;">
                                Action
                                         
                              </th>
                        </thead>
                        <tbody>
                                <tr *ngFor="let item of listMezonToken | paginate: {
                                    id: 'server',
                                    itemsPerPage: pageSize,
                                    currentPage: pageNumber,
                                    totalItems: totalItems
                                  }; let i =index">
                                    <td class="text-center sticky-col ">{{(pageNumber-1)*pageSize+i+1}}</td>  
                                <td class="sticky-col">    
                                    <app-user-info     
                                    [isAllowAvatarRouting]="isAllowViewTabPersonalInfo()"
                                    [isAllowRouting]="isAllowViewTabPersonalInfo()"
                                    [link]="['/app/employees/list-employee/employee-detail/personal-info']" 
                                    [queryParams]="{id:item.employeeId}"
                                    [userData]="{
                                        id: item.employeeId,
                                        avatarFullPath: item.avatarFullPath,
                                        fullName: item.fullName,
                                        sex: item.sex,  
                                        email: item.email,
                                        branchInfo: item.branchInfo,
                                        jobPositionInfo: item.jobPositionInfo,
                                        userTypeInfo: item.userTypeInfo,
                                        levelInfo: item.levelInfo
                                      }"
                                      
                                      >
                                    </app-user-info>
                                  </td>

                                  <td class="text-center align-middle" >
                                    <span>{{item.payrollName}}</span>
                                </td> 
                                <td class="text-right align-middle" >
                                    <span>{{item.amount | moneyFormat}}</span>
                                </td>
                                <td class="text-left align-middle" >
                                    <span>{{item.note}}</span>
                                </td>
                                <td class="text-center align-middle">
                            
                                        <p [ngStyle]="{ color: APP_ENUM.StatusSendTokenColor[item.statusToken] }" class="align-middle">
                                            {{statusSendConvert[item.statusToken]}}
                                        </p>

                                </td>
                                <td class="text-center align-middle">
                                    <p>{{item.sentToEmployeeAt | date: 'dd/MM/yyyy HH:mm'}}</p>
                                <td class="text-center">
                                    <ng-container *ngIf="isCheckAction(item.statusToken)">
                                      <button [matMenuTriggerFor]="menu" class="btn mr-2">
                                        <i class="fas fa-bars fa-lg"></i>  
                                      </button>
                                      <mat-menu #menu="matMenu" class="p-2">
                                        <button *ngIf="isShowEditBtn()" class="mat-menu-item" (click)="openEditMezonToken(item)">
                                            <i class="fas fa-pencil-alt mr-1"></i>
                                            Edit
                                          </button>
                                        <button *ngIf="isShowDeleteBtn()" (click)="onDelete(item.id)" class="mat-menu-item">
                                          <i class="fa-solid fa-trash-can mr-2"></i>Delete
                                        </button>
                                        <button *ngIf="isShowSentTokenBtn()" (click)="SentToken(item)" class="mat-menu-item">
                                            <i class="fas fa-paper-plane mr-1"></i>Send Token
                                          </button>
                                      </mat-menu> 
                                    </ng-container>
                                  </td>

                        
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer">
                <pagination-control [totalItems]="totalItems" [pageSize]="pageSizeType"
                    (pageAction)="pageControlActions($event)"></pagination-control>
            </div>
        </div>
    </div>
</div>
