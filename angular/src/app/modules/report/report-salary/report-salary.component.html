<div class="px-4 pb-2">
    <div class="breadcrumb header">
        <div class="w-100 d-flex justify-content-between">
            <app-bread-crumb  [listBreadCrumb]="listBreadCrumb"></app-bread-crumb>
            <button class="btn btn-success ml-2" (click)="onExport()" >
              <i class="fa-solid fa-download mr-1"></i>
              Export Report Salary
          </button>
        </div>
    </div>
    <div class="card " style="padding: 5px !important;">    
      <div class="card-header">
        <div class="d-flex flex-wrap justify-content-start gap-2">

          <div class="col-2 d-flex flex-column ">
            <chart-select class="w-100" style="margin-top: 8px; margin-bottom:18px;"
              (onSelect)="onPayrollSelect($event)"
              [label]="'Payroll'"
              [defaultValue]=""
              [placeholder]="'Payroll'"
              [dropdownData]="listPayrollWihStatusExecute">
            </chart-select>
      
            <chart-select class="w-100"
              (onSelect)="onEmployeeSelect($event)"
              [label]="'Employee'"
              [defaultValue]=""
              [placeholder]="'Employee'"
              [dropdownData]="listEmailEmployee">
            </chart-select>
      
            
          </div>
      
          <div class="col-10">
            <div class="row w-100 mb-4" style="align-items: center;">
              <span class="fw-bold text-start d-block "  style="font-weight: bold;" >Employee</span>
              <div class="col-md-2 w-100" >
                <chart-select 
                  (onSelect)="onBranchSelect($event)"
                  [label]="'Branch'"
                  [defaultValue]=""
                  [placeholder]="'Branch'"
                  [dropdownData]="listBranch">
                </chart-select>
              </div>
          
              <div class="col-md-2 ">
                <table-filter [searchable]="true"
                  [filterType]="filterTypeEnum.MultiSelect"
                  [dropdownData]="userLevelList"
                  [placeholder]="'User Level'"
                  (onTableMultiSelectFilter)="onTableMultiSelectLevelIdFilter($event)">
                </table-filter>
              </div>
          
              <div class="col-md-2" >
                <chart-select 
                  (onSelect)="onJobPositionSelect($event)"
                  [label]="'Position'"
                  [defaultValue]=""
                  [placeholder]="'Position'"
                  [dropdownData]="listPosition">
                </chart-select>
              </div>
              <div class="col-md-2" >
                <chart-select class="w-100"
              (onSelect)="onUserTypeSelect($event)"
              [label]="'User Type'"
              [defaultValue]=""
              [placeholder]="'User Type'"
              [dropdownData]="listUserType">
            </chart-select>
              </div>
              <div class="col-md-2">
                <chart-select 
                  (onSelect)="onTeamSelect($event)"
                  [label]="'Team'"
                  [defaultValue]=""
                  [placeholder]="'Team'"
                  [dropdownData]="listTeam">
                </chart-select>
              </div>
            </div>
          
            <div class="row w-100 mb-4" style="align-items: center;">
              <span class="fw-bold text-start d-block" style=" margin-right: 17px;font-weight: bold;">Payslip</span>
          
              <div class="col-md-2 " >
                <chart-select 
                  (onSelect)="onBranchPayslipEmplyeeSelect($event)"
                  [label]="'Branch'"
                  [defaultValue]=""
                  [placeholder]="'Branch'"
                  [dropdownData]="listBranch">
                </chart-select>
              </div>
          
              <div class="col-md-2 ">
                <table-filter [searchable]="true"
                  [filterType]="filterTypeEnum.MultiSelect"
                  [dropdownData]="userLevelList"
                  [placeholder]="'User Level'"
                  (onTableMultiSelectFilter)="onMultiSelectPayslipEmployeeLevelFilter($event)">
                </table-filter>
              </div>
          
              <div class="col-md-2" >
                <chart-select 
                  (onSelect)="onJobPositionPayslipEmplyeeSelect($event)"
                  [label]="'Position'"
                  [defaultValue]=""
                  [placeholder]="'Position'"
                  [dropdownData]="listPosition">
                </chart-select>
              </div>
              <div class="col-md-2" >
                <chart-select class="w-100"
              (onSelect)="onUserTypeEmployeePayslipSelect($event)"
              [label]="'User Type'"
              [defaultValue]=""
              [placeholder]="'User Type'"
              [dropdownData]="listUserType">
            </chart-select>
              </div>
              <div class="col-md-2">
                <chart-select 
                  (onSelect)="onTeamSelectForPaySlipEmployee($event)"
                  [label]="'Team'"
                  [defaultValue]=""
                  [placeholder]="'Team'"
                  [dropdownData]="listTeam">
                </chart-select>
              </div>
            </div>
          </div>

      
          
          <div class = "card-body" style="padding: 10px !important; overflow-x: auto; width: 100%;">
            <div class="table-responsive">
              <div class="fixTableHead">
                <div class="table-wrapper"> 
                  <div>
                    <table  [busy]="isLoading" class="table table-hover text-nowrap">
                      <thead>
                        <tr>
                          <th style="width: 50px;" class="sticky-col">#</th>
                          <th class="pointer sticky-col" (click)="onSortChange('email')" style="min-width: 350px;">Employee</th>
                          <th style="min-width: 200px;">Tổng</th>
                          <ng-container *ngFor="let month of applyDates">
                            <th style="min-width: 120px;">{{ month }}</th>
                          </ng-container>
                        </tr>
                      </thead>
                      <tbody>
                        <tr *ngFor="let item of resultList | paginate: { id: 'report', itemsPerPage: pageSize, currentPage: pageNumber, totalItems: totalItems }; let i = index">
                          <td class="text-center sticky-col ">{{ i + 1 }}</td>
                          <td *ngIf="item.infoEmployee" class="sticky-col">    
                            <app-user-info     
                              [userData]="{
                                id: item.infoEmployee.employeeId,
                                 avatarFullPath: item.infoEmployee.avatarFullPath,
                                fullName: item.infoEmployee.fullName,
                                sex: item.infoEmployee.sex,
                             
                                email: item.infoEmployee.email,
                                branchInfo: item.infoEmployee.branchInfo,
                                jobPositionInfo: item.infoEmployee.jobPositionInfo,
                                userTypeInfo: item.infoEmployee.userTypeInfo,
                                levelInfo: item.infoEmployee.levelInfo
                              }">
                            </app-user-info>
                          </td>
                          <td style="text-align: right ;font-weight: bold;" >
                            {{ item.totalSalary | moneyFormat}}
                          </td>
                          <ng-container *ngFor="let month of applyDates">
                            <td style="text-align: right; min-width: 120px;">{{ salaryByApplyDate[month][item.infoEmployee.employeeId] | moneyFormat}}</td>
                          </ng-container>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
            
          </div>
    </div>
</div>
