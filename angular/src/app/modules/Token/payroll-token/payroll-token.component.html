<div class="px-4">
    <div class="breadcrumb header">
        <app-bread-crumb [listBreadCrumb]="listBreadCrumb"></app-bread-crumb>
    </div>
    <div class="card">
        <div class="card-header">
            <div class="row">

            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <div class="fixTableHead">
                    <table class="table table-striped table-hover">
                        <thead>
                            <th class="col-stt">#</th>
                            <th>Month</th>                        
                            <th class="col-action">
                                Action
                            
                              </th>
                        </thead>
                        <tbody>
                            <tr *ngFor="let payRoll of listPayrollToken | paginate :
                            {
                                id: 'server',
                                itemsPerPage: pageSize,
                                currentPage: pageNumber,
                                totalItems: totalItems
                            };let i = index">
                                <td class="text-center align-middle">
                                    <p>{{(pageNumber-1)*pageSize + i + 1}}</p>
                                </td>
                                <td class="text-center align-middle">
                                    <a 
                                    class="hyperlink"  [routerLink]="['/app', 'list-payroll-token','list-payroll-token','list-detail']" [queryParams]="{id: payRoll.month}">{{payRoll.month }}
                                        
                                    </a>
                                </td>
                                <td class="text-center">
                                    <button [matMenuTriggerFor]="menu"
                                        class="btn mr-2">
                                        <i class="fas fa-bars fa-lg"></i>  
                                    </button>
                                    <mat-menu #menu="matMenu" class="p-2">
                                      <button *ngIf="isShowDeleteBtn()"
                                      (click)="onDelete(payRoll.month)"
                                      [disabled]
                                      class="mat-menu-item"
                                    >
                                      <i class="fa-solid fa-trash-can mr-2"></i>Delete
                                    </button>
                                    <button class="mat-menu-item" *ngIf="isShowSendBtn()">
                                      <i class="fas fa-envelope fa-lg mr-2"></i>
                                      Send 
                                    </button>
                                    </mat-menu>
                                  </td>

                        
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <pagination-control [totalItems]="totalItems" [pageSize]="pageSizeType"
                (pageAction)="pageControlActions($event)"></pagination-control>
        </div>
    </div>
</div>
