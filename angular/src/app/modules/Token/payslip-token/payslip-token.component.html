<div class="px-4">
    <div class="breadcrumb header">
        <app-bread-crumb [listBreadCrumb]="listBreadCrumb"></app-bread-crumb>
    </div>
    <div class="card">
        <div class="card-header">
            <div class="row">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <app-search [placeholder]="'Search by Name or Email'" class="col-6"
                                (onSearch)="onSearchEnter($event)">
                    </app-search>
                    <button class="btn btn-primary">
                        Send All
                    </button>
                </div>
                
                
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <div class="fixTableHead">
                    <table class="table table-striped table-hover">
                        <thead>
                            <th class="col-stt">#</th>
                            <th>EmailAddress</th> 
                            <th>MezonToken</th>  
                            <th>Note</th>
                            <th>Status</th>
                                            
                            <th class="col-action">
                                Action
                                         
                              </th>
                        </thead>
                        <tbody>
                            <tr *ngFor="let payslip of listPayslipToken | paginate :
                            {
                                id: 'server',
                                itemsPerPage: pageSize,
                                currentPage: pageNumber,
                                totalItems: totalItems
                            };let i = index">
                                <td class="text-center align-middle">
                                    <p>{{(pageNumber-1)*pageSize + i + 1}}</p>
                                </td>
                                <td class="text-center align-middle" >
                                    <b>{{payslip.emailAddress}}</b>
                                </td>
                                <td class="text-center align-middle" >
                                    <b>{{payslip.amount | moneyFormat}}</b>
                                </td>
                                <td class="text-center align-middle" >
                                    <b>{{payslip.note}}</b>
                                </td>
                                <td class="text-center align-middle">
                            
                                        <p [ngStyle]="{ color: APP_ENUM.StatusSendTokenColor[payslip.status] }" class="align-middle">
                                            {{statusSendTokens[payslip.status]}}
                                        </p>

                                </td>
                                <td class="text-center">
                                    <ng-container *ngIf="isCheckAction(payslip.status)">
                                      <button [matMenuTriggerFor]="menu" class="btn mr-2">
                                        <i class="fas fa-bars fa-lg"></i>  
                                      </button>
                                      <mat-menu #menu="matMenu" class="p-2">
                                        <button (click)="onDelete(payslip.id)" class="mat-menu-item">
                                          <i class="fa-solid fa-trash-can mr-2"></i>Delete
                                        </button>
                                        <button class="mat-menu-item" (click)="SendToken(payslip.id)">
                                          <i class="fas fa-envelope fa-lg mr-2"></i>
                                          Send 
                                        </button>
                                      </mat-menu>
                                    </ng-container>
                                  </td>

                        
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <pagination-control [totalItems]="totalItems" [pageSize]="pageSizeType"
                (pageAction)="pageControlActions($event)"></pagination-control>
        </div>
    </div>
</div>
